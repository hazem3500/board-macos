[package]
name = "board-mac"
version = "1.0.0"
description = "Board for macOS: the oz-home Board in a native Mac window, with a menu-bar count and answerable notifications"
edition = "2021"
publish = false

[lib]
name = "board_mac"
path = "src/lib.rs"

[[bin]]
name = "board-mac"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-user-notifications = "0.3"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
